<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circomedia &middot; My Timetable Feed</title>
    <link rel="stylesheet" href="/tailwind.css" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  </head>
  <body class="max-w-lg">
    <main class="mx-auto w-full max-w-xl px-4 py-10">
      <header class="text-center">
        <h1 class="text-2xl font-bold tracking-tight">
          Circomedia &middot; My Timetable Feed
        </h1>
        <p class="mt-2 text-sm text-slate-600">
          Type your first name to get your personal calendar feed. Subscribe
          once &mdash; new weeks appear automatically.
        </p>
      </header>

      <div class="mt-6">
        <label for="name" class="sr-only">Your first name</label>
        <div class="relative">
          <input
            id="name"
            name="name"
            type="search"
            autocomplete="off"
            placeholder="e.g. Yotam"
            hx-get="/api/student"
            hx-trigger="keyup changed delay:300ms, search"
            hx-target="#result"
            hx-swap="innerHTML"
            hx-indicator="#spinner"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-lg shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          />
          <span
            id="spinner"
            class="htmx-indicator absolute right-3 top-3.5 text-sm text-slate-400"
            >Searching&hellip;</span
          >
        </div>
      </div>

      <div id="result" class="mt-4" aria-live="polite"></div>

      <footer class="mt-8 text-center text-xs text-slate-500">
        <p>
          Timetable updated
          <span hx-get="/api/meta" hx-trigger="load" hx-swap="innerHTML"
            >…</span
          >
          &middot; changes reach your calendar within about an hour.
        </p>
      </footer>
    </main>

    <script>
      function copyFeed(btn) {
        var url = btn.getAttribute("data-url");
        function done() {
          var old = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(function () {
            btn.textContent = old;
          }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () {
            fallback();
          });
        } else {
          fallback();
        }
        function fallback() {
          var input = document.getElementById("feed-url");
          input.select();
          try {
            document.execCommand("copy");
          } catch (e) {}
          done();
        }
      }
    </script>
  </body>
</html>
